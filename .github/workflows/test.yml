name: test

# テストの緑を自己申告ではなく機械で確認する (逆戻り検出)。
# action は commit SHA で固定する (repo 設定で SHA 固定が必須)。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }   # README が宣言する下限
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }  # 主開発環境 (WSL fallback 等の分岐を含む)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pytest tests -q -p no:cacheprovider
